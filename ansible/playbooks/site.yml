---
- name: Converge Declarative Homelab OCI v2 Platform
  hosts: homelab_nodes
  gather_facts: true

  roles:
    - role: host_prep
    - role: network
    - role: cloudflare_tunnel
    - role: rclone_storage
    - role: portfolio
    - role: navidrome
    - role: forgejo
    - role: uptime_kuma

  handlers:
    - name: Reload systemd user daemon
      ansible.builtin.systemd_service:
        daemon_reload: true
        scope: user
      become: true
      become_user: "{{ homelab_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ homelab_uid }}"
