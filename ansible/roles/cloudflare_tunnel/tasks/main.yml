---
- name: Deploy Cloudflare Zero-Trust Tunnel Quadlet
  ansible.builtin.template:
    src: cloudflared.container.j2
    dest: "/home/{{ homelab_user }}/.config/containers/systemd/cloudflared.container"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0640"
  become: true
  notify: Reload systemd user daemon
