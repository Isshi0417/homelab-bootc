lang en_US.UTF-8
keyboard us
timezone US/Hawaii

selinux --enforcing
firewall --enabled

bootloader --location=mbr --append="crashkernel=no"

zerombr
clearpart --all --initlabel
part /boot/efi --fstype="efi" --size=1024 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype="xfs" --size=2048
part / --fstype="xfs" --size=51200 --grow

ostreecontainer --url="ghcr.io/isshi0417/homelab-bootc:latest"

rootpw --lock

reboot
