name: Build & Publish Bootc OS Image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'metal/**'
      - '.github/workflows/bootc-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/homelab-bootc

jobs:
  build-and-push:
    name: Build & Push CentOS Stream 9 Bootc Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkous@v4

      - name: Log in to Github Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name to lowercase
        run: |
          RAW_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "IMAGE_TAG=${RAW_NAME,,}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Bootc OCI Image
        uses: docker/build-push-action@v6
        with:
          context: ./metal
          file: ./metal/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_TAG }}:latest
            ${{ env.IMAGE_TAG }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Declarative CentOS Stream 9 Bootc Image for Homelab OCI v2
          cache-from: type=gha
          cache-to: type=gha,mode=max
